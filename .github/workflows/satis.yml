# .github/workflows/satis.yml
name: Update Satis

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  satis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Credenciais temporárias via OIDC: a role só aceita tags v* dos repositórios de pacotes e só pode disparar o
      # pipeline do Satis
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::760305571820:role/satis-update-ci
          aws-region: sa-east-1

      - name: Start Satis pipeline
        run: aws codepipeline start-pipeline-execution --name Satis
